openapi: 3.1.0
info:
  title: Home Service Backend API
  version: 1.0.0
  description: Minimal OpenAPI specification for the Home Service backend (auth, providers, uploads, services)
servers:
  - url: http://localhost:5000/api
paths:
  /auth/signup:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                password:
                  type: string
                userType:
                  type: string
      responses:
        '201':
          description: Created
  /providers/profile:
    get:
      summary: Get current provider profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Provider profile
    put:
      summary: Update current provider profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
                location:
                  type: string
                phone:
                  type: string
      responses:
        '200':
          description: Updated
  /providers/works:
    post:
      summary: Create a new work
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                date:
                  type: string
                serviceId:
                  type: string
      responses:
        '201':
          description: Created
    get:
      summary: Get the current provider's works
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of works
  /providers/{id}/works:
    get:
      summary: Get public works for a provider (paginated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated works
  /providers/upload/image:
    post:
      summary: Upload an image file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
